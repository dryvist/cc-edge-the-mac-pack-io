name: Validate
on:
  push:
    paths:
      - "default/**"
      - "data/**"
      - "package.json"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "default/**"
      - "data/**"
      - "package.json"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: jpe-cribl/.github/.github/workflows/cribl-pack-validate.yml@380014809fe6474c13d171d88bfa877da34ca272 # main
    with:
      pack_type: edge
