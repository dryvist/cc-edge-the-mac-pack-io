name: Validate
on:
  push:
    paths:
      - "default/**"
      - "data/**"
      - "package.json"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "default/**"
      - "data/**"
      - "package.json"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: jpe-cribl/.github/.github/workflows/cribl-pack-validate.yml@3f5ac70561d7568423370112f62e785c960262cb # main
    with:
      pack_type: edge
