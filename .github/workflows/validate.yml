name: Validate
on:
  push:
    paths:
      - "default/**"
      - "data/**"
      - "package.json"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "default/**"
      - "data/**"
      - "package.json"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: jpe-cribl/.github/.github/workflows/cribl-pack-validate.yml@b5a2249872c761f9462b60abf67b11d89473bf8d # main
    with:
      pack_type: edge
