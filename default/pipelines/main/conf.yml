output: default
streamtags: []
groups: {}
asyncFuncTimeout: 1000
description: >-
  Stamps Splunk-canonical fields (index, sourcetype, host) on every event,
  derives battery health, extracts top processes by energy impact, and flags
  exec-source anomalies.
functions:
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        # Perf/metric datatypes route to mac_perf; everything else (event-type
        # telemetry: unified logs, thermal, battery, crash reports) stays in os.
        - name: index
          value: "['macos-power-metrics', 'macos-system-metrics', 'macos-wired-memory', 'macos-macmon'].includes(datatype) ? 'mac_perf' : 'os'"
        # Explicit per-datatype map, not a fallback chain: an unmatched
        # datatype (e.g. a new input added without updating this map) is left
        # with sourcetype undefined so it's visibly wrong rather than silently
        # mislabeled by a guessed string. Keep these names as the canonical
        # ones — a downstream Splunk TA has props keyed to this exact
        # namespacing, and any instance-level config that diverges from it
        # should be converged to match this pack, not the reverse.
        - name: sourcetype
          value: >-
            ({'macos-unified-log':'macos:unified_log','macos-system-metrics':'macos:system:metrics','macos-system-thermal':'macos:system:thermal','macos-power-metrics':'macos:perf:powermetrics','macos-power-battery':'macos:power:battery','macos-wired-memory':'macos:perf:wired_memory','macos-macmon':'macos:perf:macmon','macos-crashreport':'macos:crashreport'})[datatype]
        - name: host
          value: "host || C.os.hostname()"
  - id: eval
    filter: "datatype === 'macos-crashreport'"
    disabled: false
    conf:
      add:
        # A claim about the bytes in front of the pipeline, not about
        # provenance: true when the event's raw content itself carries a
        # report timestamp the breaker could parse (the quoted-timestamp
        # JSON header for .ips/.panic/.diag, or the Date/Time: line for
        # .spin); false for .shutdownStall, a binary spindump report with no
        # timestamp anywhere in the breaker's scan window, whose _time always
        # falls back to break/arrival time. Deliberately never sets _time —
        # this is one input to what the breaker already decided, not a
        # second writer of it. false is not "missing"; it says arrival time
        # was used, which is a stronger, more useful signal than a marker
        # that only ever appears on the failure case.
        - name: crash_time_in_band
          value: >-
            /^(?:\{[^\n]{0,119}"timestamp":"|Date\/Time:)/.test(_raw)
  - id: eval
    filter: "datatype === 'macos-power-battery'"
    disabled: false
    conf:
      add:
        - name: battery_health_percent
          value: "design_capacity > 0 ? Math.round(max_capacity / design_capacity * 1000) / 10 : undefined"
  - id: eval
    filter: "datatype === 'macos-power-metrics'"
    disabled: false
    conf:
      add:
        - name: top_processes
          value: "Array.isArray(tasks) ? tasks.slice().sort((a,b) => (b.energy_impact||0) - (a.energy_impact||0)).slice(0,10).map(t => ({name: t.name, pid: t.pid, energy_impact: t.energy_impact})) : undefined"
  - id: eval
    filter: "datatype === 'macos-macmon'"
    disabled: false
    conf:
      add:
        # macmon nests temperature/memory under temp{}/memory{}, and reports
        # GPU frequency/utilization as a [freq_mhz, ratio] tuple rather than
        # flat fields; flatten all of it so Publish Metrics below references
        # plain names rather than relying on dotted-path/index support in
        # eventFieldName.
        - name: cpu_temp_celsius
          value: "temp?.cpu_temp_avg"
        - name: gpu_temp_celsius
          value: "temp?.gpu_temp_avg"
        - name: ram_used_bytes
          value: "memory?.ram_usage"
        - name: ram_total_bytes
          value: "memory?.ram_total"
        - name: gpu_freq_mhz
          value: "gpu_usage?.[0]"
        - name: gpu_scaled_ratio
          value: "gpu_usage?.[1]"
  - id: publish_metrics
    filter: "datatype === 'macos-macmon'"
    disabled: false
    conf:
      # One Gauge per macmon field — point-in-time GPU utilization/frequency,
      # per-rail power (CPU/GPU/ANE/RAM/combined), temperatures, and RAM. All
      # already top-level in macmon's JSON except the six flattened above.
      metrics:
        - eventFieldName: gpu_scaled_ratio
          metricNameExpression: "'macos.macmon.gpu.utilization_ratio'"
          metricType: Gauge
        - eventFieldName: gpu_freq_mhz
          metricNameExpression: "'macos.macmon.gpu.freq_mhz'"
          metricType: Gauge
        - eventFieldName: cpu_power
          metricNameExpression: "'macos.macmon.power.cpu_watts'"
          metricType: Gauge
        - eventFieldName: gpu_power
          metricNameExpression: "'macos.macmon.power.gpu_watts'"
          metricType: Gauge
        - eventFieldName: ane_power
          metricNameExpression: "'macos.macmon.power.ane_watts'"
          metricType: Gauge
        - eventFieldName: ram_power
          metricNameExpression: "'macos.macmon.power.ram_watts'"
          metricType: Gauge
        - eventFieldName: gpu_ram_power
          metricNameExpression: "'macos.macmon.power.gpu_ram_watts'"
          metricType: Gauge
        - eventFieldName: all_power
          metricNameExpression: "'macos.macmon.power.all_watts'"
          metricType: Gauge
        - eventFieldName: sys_power
          metricNameExpression: "'macos.macmon.power.sys_watts'"
          metricType: Gauge
        - eventFieldName: cpu_temp_celsius
          metricNameExpression: "'macos.macmon.temp.cpu_celsius'"
          metricType: Gauge
        - eventFieldName: gpu_temp_celsius
          metricNameExpression: "'macos.macmon.temp.gpu_celsius'"
          metricType: Gauge
        - eventFieldName: ram_used_bytes
          metricNameExpression: "'macos.macmon.memory.ram_used_bytes'"
          metricType: Gauge
        - eventFieldName: ram_total_bytes
          metricNameExpression: "'macos.macmon.memory.ram_total_bytes'"
          metricType: Gauge
      addDimensions:
        - host
      removeDimensions: []
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: anomaly
          value: "(datatype === 'macos-power-battery' && battery_health_percent !== undefined && battery_health_percent < 80) || (datatype === 'macos-power-metrics' && thermal?.thermal_pressure !== undefined && thermal.thermal_pressure !== 'Nominal') ? true : undefined"
        - name: anomaly_reason
          value: "(datatype === 'macos-power-battery' && battery_health_percent !== undefined && battery_health_percent < 80) ? 'battery_health_degraded' : (datatype === 'macos-power-metrics' && thermal?.thermal_pressure !== undefined && thermal.thermal_pressure !== 'Nominal') ? 'thermal_pressure_elevated' : undefined"
